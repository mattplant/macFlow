# -----------------------------------------------------
# Input: Mac Feel
# -----------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1

    # Natural Scrolling for Trackpad/Mouse
    natural_scroll = true
    touchpad {
         natural_scroll = true
         tap-to-click = true
    }

    # Sensitivity (Optional tweak for VM mouse feel)
    sensitivity = 0
}

# -----------------------------------------------------
# Layout & Appearance (Brutalist / High Performance)
# -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Solid Matrix Green to match Waybar
    col.active_border = rgb(00ff99)
    # Inactive: Dark Grey
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

dwindle {
    # Note: dwindle:pseudotile was removed in Hyprland 0.5x -- there is no
    # pseudo* config option any more. Pseudotiling is dispatcher-only now,
    # e.g. bind = $mainMod, P, togglepseudo
    preserve_split = true
}

decoration {
    # Disable expensive effects for rock-solid VM performance
    rounding = 5
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Note: misc:vfr moved to debug:vfr in Hyprland 0.5x and is ON by default,
    # so we still get the CPU saving. Upstream describes debug:vfr as
    # "do not turn off unless debugging", so we deliberately do not set it.
}
