# -----------------------------------------------------
# Window Rules
# -----------------------------------------------------
# Syntax note: Hyprland 0.5x replaced both older forms.
#   windowrulev2 = float, class:^(x)$   -> "windowrulev2 is deprecated"
#   windowrule   = float, class:^(x)$   -> "invalid field float: missing a value"
# The current form pairs a property with a match: predicate, as below.
# Verified against Hyprland 0.54.2 with `hyprctl configerrors`.

# Cheatsheet (Help Menu) Rules
windowrule = float on, match:class ^(macFlow_Help)$
windowrule = center on, match:class ^(macFlow_Help)$
windowrule = size 900 600, match:class ^(macFlow_Help)$

# -----------------------------------------------------
# Removed upstream: scratchpad + fullscreen highlighting
# -----------------------------------------------------
# These previously gave the scratchpad a yellow border with a dimmed
# background, and turned the border yellow in fullscreen/monocle mode:
#
#   bordercolor rgb(ffff00), match:workspace name:special:special
#   dimaround on,            match:workspace name:special:special
#   bordercolor rgb(ffff00), match:fullscreen 1
#
# Hyprland 0.54.2 rejects both properties outright, in inline *and* block
# form, with "config option <windowrule:bordercolor> does not exist" and the
# same for dimaround. This is not a syntax problem -- the rule types were
# removed upstream, so there is nothing to migrate them to. Do not try to
# "fix" the syntax; it will not help.
